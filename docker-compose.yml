name: kampalasmart

services:
  postgres:
    image: postgres:16-alpine
    container_name: kampala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kampala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kampala}
      POSTGRES_DB: ${POSTGRES_DB:-kampalasmart}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kampala} -d ${POSTGRES_DB:-kampalasmart}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: kampala-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:

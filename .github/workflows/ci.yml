name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build -w @kampalasmart/web

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kampala
          POSTGRES_PASSWORD: kampala
          POSTGRES_DB: kampalasmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kampala -d kampalasmart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://kampala:kampala@localhost:5432/kampalasmart_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-integration-secret-value-with-at-least-32-chars
      COOKIE_SECURE: 'false'
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run test:integration

  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kampala
          POSTGRES_PASSWORD: kampala
          POSTGRES_DB: kampalasmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kampala -d kampalasmart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://kampala:kampala@localhost:5432/kampalasmart?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-e2e-secret-value-with-at-least-32-chars
      COOKIE_SECURE: 'false'
      WEB_ORIGIN: http://localhost:3000
      EMAIL_PROVIDER: development-outbox
      LOGIN_RATE_LIMIT: '1000'
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build -w @kampalasmart/api
      - run: npm run build -w @kampalasmart/web
      - name: Start API
        run: |
          npm run start:prod -w @kampalasmart/api > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become ready"; cat /tmp/api.log; exit 1
      - name: Start web
        run: |
          npm run start -w @kampalasmart/web > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Web did not become ready"; cat /tmp/web.log; exit 1
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
